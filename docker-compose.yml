
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment: 
      - ALLOW_ORIGINS=http://localhost:8080
    ports:
      - "8000:8000"
    env_file:
      - ./app/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
